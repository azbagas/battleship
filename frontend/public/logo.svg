<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.35" />
      <stop offset="72%" stop-color="#0b2239" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="sweepGrad" x1="32" y1="32" x2="50" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Tactical Badge Frame -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#radarGlow)" stroke="#164e63" stroke-width="2" />

  <!-- Radar Rings & Upper-Right Sweep -->
  <circle cx="32" cy="32" r="23" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.6" />
  <circle cx="32" cy="32" r="16.5" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="4 3" />
  <path d="M32 32 L48.3 15.7 A23 23 0 0 0 32 9 Z" fill="url(#sweepGrad)" />

  <!-- Cardinal Reticle Ticks -->
  <line x1="32" y1="5" x2="32" y2="12" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="52" x2="32" y2="59" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
  <line x1="5" y1="32" x2="12" y2="32" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
  <line x1="52" y1="32" x2="59" y2="32" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />

  <!-- Front-Facing Armored Warship Bow -->
  <!-- Mast & Yardarm -->
  <path d="M29.5 21 L31 13 L33 13 L34.5 21 Z" fill="#103152" stroke="#22d3ee" stroke-width="1.4" stroke-linejoin="round" />
  <line x1="27" y1="16" x2="37" y2="16" stroke="#67e8f9" stroke-width="1.6" stroke-linecap="round" />

  <!-- Upper Bridge & Superstructure -->
  <polygon points="24,27 26.5,21 37.5,21 40,27" fill="#103152" stroke="#22d3ee" stroke-width="1.6" stroke-linejoin="round" />
  <line x1="27.5" y1="24" x2="36.5" y2="24" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" />

  <!-- Main Forecastle & Armored Bow Hull -->
  <polygon points="17.5,38 22,27 42,27 46.5,38 32,49" fill="#0b2239" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" />
  <!-- Port/Starboard Facet Shading -->
  <polygon points="17.5,38 22,27 32,31 32,49" fill="#1e3a5f" fill-opacity="0.55" />
  <!-- Bow Centerline Keel & Deck Ridge -->
  <polyline points="17.5,38 32,31 46.5,38" stroke="#67e8f9" stroke-width="1.5" stroke-linejoin="round" />
  <line x1="32" y1="31" x2="32" y2="49" stroke="#22d3ee" stroke-width="1.6" />
</svg>
